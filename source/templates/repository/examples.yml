- name: Example
  uses: mrDuckdevX/matrix-duck@latest
  with:
    template: repository
    filename: metrics.repository.svg
    token: ${{ secrets.METRICS_TOKEN_WITH_SCOPES }}
    user: matrix-duck
    repo: metrics
    plugin_lines: yes
    plugin_followup: yes
    plugin_projects: yes
    plugin_projects_repositories: mrDuckdevX/matrix-duck/projects/1