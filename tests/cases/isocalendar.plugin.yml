- name: 📅 Isometric commit calendar - Half-year calendar
  uses: mrDuckdevX/matrix-duck@latest
  with:
    token: MOCKED_TOKEN
    plugin_isocalendar: 'yes'
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 📅 Isometric commit calendar - Full-year calendar
  uses: mrDuckdevX/matrix-duck@latest
  with:
    token: MOCKED_TOKEN
    plugin_isocalendar: 'yes'
    plugin_isocalendar_duration: full-year
    use_mocked_data: 'yes'
    verify: 'yes'
